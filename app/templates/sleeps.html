{% extends "base.html" %}
{% from "components/macros.html" import page_header %}
{% block content %}
<div class="min-h-screen">

  {{ page_header(baby, "Sleep") }}

  <!-- Sleep section -->
  <div class="p-4 pb-28" id="sleep-section">
    {% include "partials/sleep_list.html" %}
  </div>

  <!-- Start sleep FAB (only when no active sleep) -->
  {% if not sleep %}
  <div class="fixed bottom-20 right-4 z-30">
    <form hx-post="/babies/{{ baby.id }}/sleeps/start"
          hx-target="#sleep-section"
          hx-swap="innerHTML">
      <button type="submit"
              class="btn btn-secondary rounded-2xl w-14 h-14 shadow-lg">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
        </svg>
      </button>
    </form>
  </div>
  {% endif %}

</div>
{% endblock %}

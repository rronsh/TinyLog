{% extends "base.html" %}
{% block content %}
<div class="min-h-screen">

  <!-- Header -->
  <div class="bg-base-100 px-5 pt-12 pb-5 border-b border-base-300">
    <div class="flex items-center gap-4">
      <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-white font-bold text-lg shadow-sm"
           style="background-color: {{ baby.avatar_color }}">
        {{ baby.name[0].upper() }}
      </div>
      <div>
        <h1 class="text-xl font-bold text-base-content">{{ baby.name }}</h1>
        <p class="text-sm text-base-content/65">
          Born {{ baby.birth_date | date_fmt }}
        </p>
      </div>
    </div>
  </div>

  <div class="p-4 space-y-4">

    <!-- Feeding card -->
    <div class="card bg-base-100 shadow-sm rounded-2xl overflow-hidden">
      <div class="flex items-center justify-between px-4 pt-4 pb-3 border-b border-base-200">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl bg-amber-100 flex items-center justify-center">
            <svg class="w-4 h-4 text-amber-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"/>
            </svg>
          </div>
          <span class="font-semibold text-base-content">Feeding</span>
        </div>
        <a href="/babies/{{ baby.id }}/feedings" class="link text-sm font-medium">See all</a>
      </div>

      <div id="dashboard-feeding-section"
           hx-get="/babies/{{ baby.id }}/feedings/dashboard"
           hx-trigger="feedingLogged from:body"
           hx-swap="innerHTML">
        {% include "partials/dashboard_feeding_body.html" %}
      </div>
    </div>

    <!-- Sleep card -->
    <div class="card bg-base-100 shadow-sm rounded-2xl overflow-hidden">
      <div class="flex items-center justify-between px-4 pt-4 pb-3 border-b border-base-200">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl bg-indigo-100 flex items-center justify-center">
            <svg class="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
            </svg>
          </div>
          <span class="font-semibold text-base-content">Sleep</span>
        </div>
        <a href="/babies/{{ baby.id }}/sleeps" class="link text-sm font-medium">See all</a>
      </div>

      <div id="sleep-section">
        {% include "partials/dashboard_sleep_body.html" %}
      </div>
    </div>

  </div>
</div>
{% endblock %}

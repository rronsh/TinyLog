<div x-data="{
    open: false,
    message: '',
    url: '',
    target: '',
    swap: 'outerHTML',
    show(detail) {
      this.message = detail.message ?? 'Are you sure?';
      this.url     = detail.url;
      this.target  = detail.target;
      this.swap    = detail.swap ?? 'outerHTML';
      this.open    = true;
    },
    confirm() {
      htmx.ajax('DELETE', this.url, {target: this.target, swap: this.swap});
      this.open = false;
    }
  }"
  @confirm-delete.window="show($event.detail)"
  x-init="$watch('open', v => document.body.style.overflow = v ? 'hidden' : '')">

  <!-- Backdrop -->
  <div x-show="open"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0"
       x-transition:enter-end="opacity-100"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="opacity-100"
       x-transition:leave-end="opacity-0"
       @click="open = false"
       class="fixed inset-0 bg-black/40 z-[60]"
       style="display:none">
  </div>

  <!-- Dialog -->
  <div x-show="open"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0 scale-95"
       x-transition:enter-end="opacity-100 scale-100"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="opacity-100 scale-100"
       x-transition:leave-end="opacity-0 scale-95"
       class="fixed inset-0 z-[70] flex items-center justify-center p-6"
       style="display:none">
    <div class="bg-base-100 rounded-2xl shadow-xl w-full max-w-xs p-6">
      <h3 class="text-base font-bold text-error mb-1">Delete</h3>
      <p class="text-sm text-base-content/65 mb-6" x-text="message"></p>
      <div class="flex gap-3">
        <button @click="open = false"
                class="btn btn-ghost flex-1 rounded-xl">
          Cancel
        </button>
        <button @click="confirm()"
                class="btn btn-soft btn-error flex-1 rounded-xl">
          Delete
        </button>
      </div>
    </div>
  </div>

</div>

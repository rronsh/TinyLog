<div id="feeding-timer-section"
     x-data="{
       lastSwitchAt: {{ active.last_switch_at * 1000 }},
       leftAcc: {{ active.left_accumulated }},
       rightAcc: {{ active.right_accumulated }},
       currentSide: '{{ active.current_side }}',
       get currentElapsed() { $store.feedingTimer._tick; return Math.floor((Date.now() - this.lastSwitchAt) / 1000); },
       get leftTotal() { return this.leftAcc + (this.currentSide === 'left' ? this.currentElapsed : 0); },
       get rightTotal() { return this.rightAcc + (this.currentSide === 'right' ? this.currentElapsed : 0); },
       get totalElapsed() { return this.leftTotal + this.rightTotal; },
       fmt(s) { const m = Math.floor(s / 60); return String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
     }"
     x-init="$store.feedingTimer.running = true; $store.feedingTimer.babyId = '{{ baby.id }}'; $store.feedingTimer.startTick()">

  <div class="text-5xl font-bold text-center text-accent py-6 tabular-nums"
       x-text="fmt(totalElapsed)">00:00</div>

  <div class="join w-full mb-4">
    <button type="button"
            class="join-item btn flex-1 gap-1"
            :class="currentSide === 'left' ? 'btn-accent' : 'btn-ghost'"
            hx-post="/babies/{{ baby.id }}/feedings/active/switch"
            hx-vals='{"side": "left"}'
            hx-target="#feeding-timer-section"
            hx-swap="outerHTML">
      L &nbsp;·&nbsp; <span x-text="fmt(leftTotal)" class="tabular-nums">00:00</span>
    </button>
    <button type="button"
            class="join-item btn flex-1 gap-1"
            :class="currentSide === 'right' ? 'btn-accent' : 'btn-ghost'"
            hx-post="/babies/{{ baby.id }}/feedings/active/switch"
            hx-vals='{"side": "right"}'
            hx-target="#feeding-timer-section"
            hx-swap="outerHTML">
      R &nbsp;·&nbsp; <span x-text="fmt(rightTotal)" class="tabular-nums">00:00</span>
    </button>
  </div>

</div>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TinyLog · Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: #fff1f2; min-height: 100vh; display: flex;
           align-items: center; justify-content: center; padding: 1.5rem; }
    .card { text-align: center; }
    .icon { width: 4rem; height: 4rem; background: #ffe4e6; border-radius: 1.5rem;
            display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; }
    h1 { font-size: 1.25rem; font-weight: 700; color: #1f2937; margin-bottom: 0.5rem; }
    p { font-size: 0.875rem; color: #6b7280; margin-bottom: 1.5rem; }
    button { background: #f43f5e; color: white; border: none; border-radius: 0.75rem;
             padding: 0.75rem 1.5rem; font-size: 0.875rem; font-weight: 600; cursor: pointer; }
    button:active { transform: scale(0.95); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="32" height="32" fill="none" stroke="#fda4af" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M3 3l18 18M10.58 10.58a2 2 0 002.83 2.83M7.243 7.243A6 6 0 0012 6c3.314 0 6 2.686 6 6a6 6 0 01-.246 1.69M3.515 3.515A12 12 0 002 12c0 6.627 5.373 12 12 12a12 12 0 008.485-3.515"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Check your connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
